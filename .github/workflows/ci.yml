name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Manifests
        run: python3 scripts/validate.py
      - name: Shell scripts
        run: shellcheck -S warning extensions/*/build.sh extensions/*/files/*.sh

  # Builds every extension, on the same runners and image as a release.
  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    container: debian:bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: for b in extensions/*/build.sh; do sh "$b" dist; done
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.arch }}
          path: dist/
          retention-days: 7
